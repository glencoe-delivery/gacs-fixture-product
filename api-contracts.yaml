# The fixture product's GACS manifest: one provided contract and one consumer of it, in one repository.
gacs: 1
# The image the product's commands run in, pinned by digest.
image: python:3.12-slim@sha256:5e2bdb1b0d542d5039cffb8181c65930093949194a65c365dfb1b0fe13a4fa5b
provides:
  - contract: api/openapi.json
    protocol: openapi
    stability: beta
    verify:
      conformance: python3 tests/conformance.py
      security: python3 tests/security.py
consumes:
  - provider: github.com/glencoe-delivery/gacs-fixture-product/api/openapi.json
    protocol: openapi
    built_against: web/contracts/notes.json
    source: web/src
    client: typescript
    verify:
      static: python3 tests/static_check.py
      runtime: python3 tests/runtime.py
